# /etc/dhcp/dhcpd.conf · srv-ice01 (GlaciaNova)
# Sustituye los marcadores <...> por los valores de tu red de laboratorio.

default-lease-time 600;
max-lease-time 7200;
authoritative;

subnet 192.0.2.0 netmask 255.255.255.0 {
  range 192.0.2.100 192.0.2.200;          # direcciones para clientes
  option subnet-mask 255.255.255.0;
  option routers 192.0.2.1;                # puerta de enlace
  option domain-name-servers 192.0.2.10; # el DNS es el propio DC Samba
  option domain-name "glacianova.local";
}
