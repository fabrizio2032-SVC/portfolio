# /etc/netplan/00-installer-config.yaml · srv-ice01
# IP fija: el controlador de dominio debe ser siempre localizable.
network:
  version: 2
  ethernets:
    enp0s3:
      dhcp4: false
      addresses:
        - 192.0.2.10/24
      routes:
        - to: default
          via: 192.0.2.1
      nameservers:
        search: [glacianova.local]
        addresses: [127.0.0.1, 192.0.2.1]
