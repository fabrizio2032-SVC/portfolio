# /etc/dhcp/dhcpd.conf · srv-ice01 (GlaciaNova)
# Sustituye los marcadores <...> por los valores de tu red de laboratorio.

default-lease-time 600;
max-lease-time 7200;
authoritative;

subnet <RED_LAN> netmask 255.255.255.0 {
  range <INICIO_DHCP> <FIN_DHCP>;          # direcciones para clientes
  option subnet-mask 255.255.255.0;
  option routers <GATEWAY>;                # puerta de enlace
  option domain-name-servers <IP_SRV_ICE01>; # el DNS es el propio DC Samba
  option domain-name "glacianova.local";
}
