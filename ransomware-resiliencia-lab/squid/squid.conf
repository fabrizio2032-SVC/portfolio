# /etc/squid/squid.conf (extracto) · salida a Internet con lista blanca
acl lan src 198.51.100.0/24
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl destinos_ok dstdomain "/etc/squid/destinos_permitidos.txt"
acl bloqueados  dstdomain "/etc/squid/bloqueados.txt"

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny bloqueados
http_access allow lan destinos_ok
http_access deny all

http_port 3128
access_log /var/log/squid/access.log squid
