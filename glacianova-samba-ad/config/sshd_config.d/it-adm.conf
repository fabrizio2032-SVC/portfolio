# /etc/ssh/sshd_config.d/it-adm.conf · srv-ice01
# Solo los miembros de IT_ADM pueden entrar por SSH.
# Validar antes de reiniciar:  sudo sshd -t && sudo systemctl restart ssh

AllowGroups IT_ADM
PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30
PubkeyAuthentication yes
# En producción se recomienda desactivarlo y usar solo claves:
PasswordAuthentication yes
