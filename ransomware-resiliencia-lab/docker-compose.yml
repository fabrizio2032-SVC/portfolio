# /opt/resiliencia/docker-compose.yml · srv-svc01
# Pila de automatización y monitorización del laboratorio.
# Uso: cp .env.example .env && chmod 600 .env && docker compose up -d && docker compose ps

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: resiliencia
      POSTGRES_USER: ${PG_ADMIN_USER}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [data_net]

  n8n:
    image: n8nio/n8n:1.64.0
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: resiliencia
      DB_POSTGRESDB_USER: ${PG_N8N_USER}
      DB_POSTGRESDB_PASSWORD: ${PG_N8N_PASS}
      N8N_ENCRYPTION_KEY: ${N8N_KEY}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_SECURE_COOKIE: "false"   # solo laboratorio sin HTTPS
      GENERIC_TIMEZONE: Europe/Madrid
    ports: ["5678:5678"]
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on: [postgres]
    networks: [app_net, data_net]

  nginx:
    image: nginx:1.27.1-alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    networks: [app_net]

  grafana:
    image: grafana/grafana-oss:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASS}
    ports: ["3000:3000"]
    volumes:
      - grafdata:/var/lib/grafana
    depends_on: [postgres]
    networks: [app_net, data_net]

networks:
  app_net: {}
  data_net:
    internal: true   # PostgreSQL no sale a ninguna red externa

volumes:
  pgdata: {}
  n8ndata: {}
  grafdata: {}
